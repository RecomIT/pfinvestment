<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Bond Amortization</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<div class="login-wrap">
  <form class="login-box" id="f" autocomplete="on">
    <h1>Bond Amortization</h1>
    <div id="msg" hidden></div>
    <div class="field"><label for="u">Username</label><input type="text" id="u" autocomplete="username" required autofocus></div>
    <div class="field"><label for="p">Password</label><input type="password" id="p" autocomplete="current-password" required></div>
    <button class="primary" type="submit" id="go">Log in</button>
    <p class="small muted" style="margin-top:14px">You are logged out after 1 hour without activity.</p>
  </form>
</div>
<script src="/static/js/core.js"></script>
<script>
(async () => {
  if (App.qs("expired")) App.message("#msg", "warn", "Your session ended. Please log in again.");
  try {                                   // already logged in? go straight in
    const r = await fetch("/api/auth/me", { credentials: "same-origin" });
    if (r.ok) { location.href = App.safeNext(App.qs("next")); return; }
  } catch (e) { /* ignore */ }
  App.$("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    App.$("#go").disabled = true;
    try {
      const me = await App.api("POST", "/api/auth/login", { username: App.$("#u").value, password: App.$("#p").value });
      location.href = me.must_change_password ? "/account?must=1" : App.safeNext(App.qs("next"));
    } catch (e) {
      App.message("#msg", "bad", e.message);
      App.$("#p").value = ""; App.$("#p").focus();
    } finally { App.$("#go").disabled = false; }
  });
})();
</script>
</body>
</html>
