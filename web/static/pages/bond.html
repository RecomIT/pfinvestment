<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bond · Bond Amortization</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<main>
  <div class="crumbs"><a href="/">Companies</a> / <a id="c-fund"></a> / <span id="c-bond"></span></div>
  <div class="page-head">
    <div><h1 id="title"></h1><div class="muted" id="sub"></div></div>
    <div class="actions"><a class="btn" id="xlsx" title="Workbook with live formulas: inputs, schedule, years, quarters, TDS">Download Excel</a><a class="btn" id="pdf" title="Printable report with sign-off block">Download PDF</a><a class="btn primary" id="edit" hidden>Edit bond</a><button class="danger" id="del" hidden>Delete</button></div>
  </div>
  <div id="msg" hidden></div>
  <div id="warn" hidden></div>
  <div class="cards" id="cards"></div>

  <div class="tabs" role="tablist">
    <button class="active" data-tab="schedule">Amortization schedule</button>
    <button data-tab="periods">By period</button>
    <button data-tab="history">History</button>
  </div>

  <section class="panel flush" data-pane="schedule">
    <div class="panel-head"><h2>Bond amortization schedule</h2><span class="muted small">Effective interest method · interest = opening × ((1 + IRR)<sup>days/365</sup> − 1)</span></div>
    <div class="table-wrap"><table id="sched"></table></div>
  </section>

  <section class="panel flush" data-pane="periods" hidden>
    <div class="panel-head" style="flex-wrap:wrap;gap:10px">
      <div class="inline">
        <div class="field"><label for="mode">Periods</label><select id="mode">
          <option value="years">Financial years</option><option value="quarters">Quarters</option><option value="custom">Dates I choose</option></select></div>
        <div class="field" id="dates-f" hidden style="min-width:320px"><label for="dates">Cut-off dates (comma separated)</label>
          <input type="text" id="dates" placeholder="30-Jun-26, 30-Sep-26"><div class="hint" id="dates-h"></div></div>
        <div class="field" id="start-f" hidden><label for="start">Previous period end (optional)</label><input type="text" id="start" placeholder="30-Jun-26">
          <div class="hint" id="start-h">Blank = from purchase</div></div>
        <button id="run" hidden>Show</button>
      </div>
      <span class="muted small" id="basis-note"></span>
    </div>
    <div id="pmsg" hidden style="margin:12px"></div>
    <div class="table-wrap"><table id="per"></table></div>
  </section>

  <section class="panel flush" data-pane="history" hidden>
    <div class="panel-head"><h2>Saved versions</h2><span class="muted small">Click a version to compare it with the current one</span></div>
    <div class="table-wrap" style="max-height:260px"><table id="hist"></table></div>
    <div id="diff" style="padding:16px" hidden></div>
  </section>
</main>
<script src="/static/js/core.js"></script>
<script>
(async () => {
  const me = await App.init({ nav: "funds" });
  if (!me) return;
  const $ = App.$;
  const code = App.qs("fund"), isin = App.qs("isin");
  const base = "/api/funds/" + encodeURIComponent(code) + "/bonds/" + encodeURIComponent(isin);
  let record, summary, sched;
  try {
    [record, summary, sched] = await Promise.all([App.api("GET", base), App.api("GET", base + "/summary"), App.api("GET", base + "/schedule")]);
  } catch (e) { App.message("#msg", "bad", e.message); return; }
  const b = record.bond;
  if (App.qs("saved")) App.message("#msg", "ok", "Bond saved (version " + record.version + ").");
  document.title = b.isin + " · Bond Amortization";
  $("#c-fund").textContent = code; $("#c-fund").href = App.url("/fund", { code });
  $("#c-bond").textContent = b.isin;
  $("#title").textContent = b.isin + (b.name ? " · " + b.name : "");
  $("#sub").innerHTML = '<span class="badge ' + summary.status + '">' + summary.status + "</span> " +
    App.esc(App.pct(b.coupon_rate, 2) + " coupon · issued " + App.date(b.issue_date) + " · bought " + App.date(b.purchase_date) +
    " · matures " + App.date(b.maturity_date) + " · " + (b.day_basis === "excel_182" ? "Excel (182) day basis" : "Actual-days basis")) +
    (b.sale ? " · sold " + App.esc(App.date(b.sale.sale_date)) : "");
  if (sched.warnings.length) App.message("#warn", "warn", "Notes on this bond:", sched.warnings);

  $("#cards").innerHTML = [
    ["Face value", App.money(b.face_value)], ["Clean price", App.money(b.clean_price)],
    ["Accrued interest paid", App.money(b.accrued_interest_paid)], ["Settlement amount", App.money(sched.settlement_amount)],
    ["Discount / (premium)", App.money(sched.discount_premium)], ["IRR", App.pct(sched.irr)],
    ["Coupon each half-year", App.money(sched.coupon_amount)], ["Carrying value today", App.money(summary.carrying_value_today)],
  ].map(([k, v]) => '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>").join("");

  /* Excel download: always years + quarters; plus the dates last shown on the By period tab */
  function setExcelLink(params) {
    $("#xlsx").href = App.url(base + "/export.xlsx", params || {});
    $("#pdf").href = App.url(base + "/report.pdf", params || {});
    $("#xlsx").title = "Workbook with live formulas: inputs, schedule, years, quarters, TDS" +
      (params && params.dates ? " and your chosen dates" : "");
  }
  setExcelLink();

  if (App.can("editor")) {
    $("#edit").hidden = false; $("#edit").href = App.url("/bond/edit", { fund: code, isin });
    $("#del").hidden = false;
    $("#del").onclick = async () => {
      if (!window.confirm("Delete " + b.isin + " from " + code + "?\n\nIt is moved to the 'deleted' folder and can be recovered by an administrator.")) return;
      try { await App.api("DELETE", base + "?version=" + record.version); location.href = App.url("/fund", { code }); }
      catch (e) { App.message("#msg", "bad", e.message); }
    };
  }

  /* ---------------- Calculation 1: schedule */
  const rows = sched.rows.map((r, i) => ({ ...r, n: i + 1 }));
  App.renderTable($("#sched"), [
    { label: "#", key: "n", type: "int" },
    { label: "From", key: "start", type: "date" },
    { label: "Coupon date", key: "end", type: "date" },
    { label: "Days", key: "days", type: "int" },
    { label: "Beginning carrying value", key: "opening", type: "money", wrap: true },
    { label: "Interest (IRR)", key: "interest", type: "money", wrap: true },
    { label: "Coupon (gross)", key: "coupon_gross", type: "money", wrap: true },
    { label: "Accrued interest bought, recovered", key: "purchased_accrued_recovered", type: "money", wrap: true },
    { label: "Coupon received (net of bought interest)", key: "coupon_net", type: "money", wrap: true },
    { label: "Amortization", key: "amortization", type: "money" },
    { label: "Cumulative amortization", key: "cumulative_amortization", type: "money", wrap: true },
    { label: "Ending carrying value", key: "closing", type: "money", wrap: true },
  ], rows, { _label: "Total", interest: App.sum(rows, "interest"), coupon_gross: App.sum(rows, "coupon_gross"),
    purchased_accrued_recovered: App.sum(rows, "purchased_accrued_recovered"), coupon_net: App.sum(rows, "coupon_net"),
    amortization: App.sum(rows, "amortization") });

  /* ---------------- tabs */
  App.$$(".tabs button").forEach((btn) => btn.addEventListener("click", () => {
    App.$$(".tabs button").forEach((x) => x.classList.toggle("active", x === btn));
    App.$$("[data-pane]").forEach((p) => { p.hidden = p.dataset.pane !== btn.dataset.tab; });
    if (btn.dataset.tab === "periods" && !periodsLoaded) loadPeriods();
    if (btn.dataset.tab === "history" && !historyLoaded) loadHistory();
  }));

  /* ---------------- Calculation 2: by period */
  let periodsLoaded = false;
  App.dateInput($("#start"), $("#start-h"));
  $("#dates").addEventListener("input", () => {
    const parts = $("#dates").value.split(",").map((s) => s.trim()).filter(Boolean);
    const bad = parts.filter((p) => !App.parseDate(p));
    $("#dates-h").textContent = bad.length ? "Not understood: " + bad.join(", ") : parts.map((p) => App.date(App.parseDate(p))).join(", ");
    $("#dates").classList.toggle("invalid", bad.length > 0);
  });
  $("#mode").addEventListener("change", () => {
    const custom = $("#mode").value === "custom";
    $("#dates-f").hidden = $("#start-f").hidden = $("#run").hidden = !custom;
    if (!custom) loadPeriods();
  });
  $("#run").addEventListener("click", loadPeriods);
  $("#dates").addEventListener("keydown", (e) => { if (e.key === "Enter") loadPeriods(); });

  async function loadPeriods() {
    periodsLoaded = true;
    App.message("#pmsg", null);
    const mode = $("#mode").value;
    const params = { mode };
    if (mode === "custom") {
      const parts = $("#dates").value.split(",").map((s) => s.trim()).filter(Boolean);
      const isos = parts.map(App.parseDate);
      if (!parts.length || isos.some((x) => !x)) { App.message("#pmsg", "bad", "Enter one or more cut-off dates like 30-Jun-26, 30-Sep-26."); return; }
      params.dates = isos.join(",");
      if ($("#start").value.trim()) { const s = $("#start").getIso(); if (!s) { App.message("#pmsg", "bad", "Previous period end: use the form 30-Jun-26."); return; } params.start = s; }
    }
    try {
      const r = await App.api("GET", App.url(base + "/periods", params));
      setExcelLink(mode === "custom" ? { dates: params.dates, start: params.start } : null);
      $("#basis-note").textContent = r.day_basis === "excel_182" ? "Split at cut-off: days ÷ 182 (Excel basis)" : "Split at cut-off: days ÷ actual days in the coupon period";
      const ok = (p) => Math.abs(p.carrying_check) < 0.01 && Math.abs(p.receivable_check) < 0.01;
      App.renderTable($("#per"), [
        { label: "Period end", key: "period_end", type: "date", cls: "sticky" },
        { label: "Opening carrying value", key: "opening_carrying", type: "money", wrap: true },
        { label: "Investment", key: "investment", type: "money" },
        { label: "Amortization", key: "amortization", type: "money" },
        { label: "Encashed", key: "encashed_principal", type: "money" },
        { label: "Closing carrying value", key: "closing_carrying", type: "money", wrap: true },
        { label: "Opening interest receivable", key: "opening_receivable", type: "money", wrap: true },
        { label: "Interest income", key: "interest_income", type: "money", wrap: true },
        { label: "Coupon received (gross)", key: "coupon_gross", type: "money", wrap: true },
        { label: "Holding period interest", key: "purchased_accrued_recovered", type: "money", wrap: true },
        { label: "Accrued interest on sale", key: "sale_accrued_received", type: "money", wrap: true },
        { label: "Gain / (loss) on sale", key: "gain_loss", type: "money", wrap: true },
        { label: "Closing interest receivable", key: "closing_receivable", type: "money", wrap: true },
        { label: "Check", html: true, get: (p) => ok(p) ? '<span class="badge held" title="Opening + movements = closing">✓</span>' : '<span class="badge error">✗</span>' },
      ], r.rows, r.rows.length ? { _label: "Total", investment: App.sum(r.rows, "investment"), amortization: App.sum(r.rows, "amortization"),
        encashed_principal: App.sum(r.rows, "encashed_principal"), interest_income: App.sum(r.rows, "interest_income"),
        coupon_gross: App.sum(r.rows, "coupon_gross"), purchased_accrued_recovered: App.sum(r.rows, "purchased_accrued_recovered"),
        sale_accrued_received: App.sum(r.rows, "sale_accrued_received"), gain_loss: App.sum(r.rows, "gain_loss") } : null);
    } catch (e) { App.showErrors("#pmsg", e); }
  }

  /* ---------------- history */
  let historyLoaded = false;
  async function loadHistory() {
    historyLoaded = true;
    const h = (await App.api("GET", base + "/history")).reverse();
    App.renderTable($("#hist"), [
      { label: "Version", key: "version", type: "int" },
      { label: "Saved", get: (x) => App.dateTime(x.timestamp) },
      { label: "By", key: "user" },
      { label: "", html: true, get: (x) => x.version === record.version ? '<span class="badge held">current</span>'
          : '<button class="link" data-file="' + App.esc(x.file) + '">compare with current</button>' },
    ], h);
    App.$$("#hist [data-file]").forEach((btn) => btn.addEventListener("click", () => showDiff(btn.dataset.file)));
  }
  function flatten(obj, prefix, out) {
    out = out || {};
    Object.entries(obj || {}).forEach(([k, v]) => {
      const key = prefix ? prefix + "." + k : k;
      if (v && typeof v === "object" && !Array.isArray(v)) flatten(v, key, out);
      else out[key] = Array.isArray(v) ? JSON.stringify(v) : v;
    });
    return out;
  }
  async function showDiff(file) {
    const old = await App.api("GET", base + "/history/" + encodeURIComponent(file));
    const a = flatten({ bond: old.bond, coupon_actuals: old.coupon_actuals }), c = flatten({ bond: record.bond, coupon_actuals: record.coupon_actuals });
    const keys = Array.from(new Set(Object.keys(a).concat(Object.keys(c)))).sort();
    const fmt = (v) => v === null || v === undefined ? "—" : String(v);
    const changed = keys.filter((k) => fmt(a[k]) !== fmt(c[k]));
    $("#diff").hidden = false;
    $("#diff").innerHTML = "<h3>Version " + old.version + " compared with current (version " + record.version + ")</h3>" +
      (changed.length ? '<div class="table-wrap"><table><thead><tr><th>Field</th><th>Version ' + old.version + "</th><th>Current</th></tr></thead><tbody>" +
        changed.map((k) => '<tr class="changed"><td>' + App.esc(k) + "</td><td>" + App.esc(fmt(a[k])) + "</td><td>" + App.esc(fmt(c[k])) + "</td></tr>").join("") +
        "</tbody></table></div>" : '<p class="muted">No differences in the bond inputs.</p>');
  }
})();
</script>
</body>
</html>
