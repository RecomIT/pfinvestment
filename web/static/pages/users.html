<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Users · Bond Amortization</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<main>
  <div class="page-head"><div><h1>Users</h1><div class="muted">Viewer: see everything · Editor: also add and change bonds · Admin: also funds and users</div></div>
    <div class="actions"><button class="primary" id="new">New user</button></div></div>
  <div id="msg" hidden></div>
  <div class="panel flush"><div class="table-wrap"><table id="t"></table></div></div>
</main>
<dialog id="dlg"><form method="dialog" id="f">
  <h2 id="dlg-title">New user</h2><div id="fmsg" hidden></div>
  <div class="form-grid" style="grid-template-columns:1fr 1fr">
    <div class="field"><label>Username</label><input type="text" id="u" data-field="username" autocomplete="off"><div class="hint">3-32 lowercase letters, digits, . _ -</div></div>
    <div class="field"><label>Full name</label><input type="text" id="fn" data-field="full_name"></div>
    <div class="field"><label>Role</label><select id="role" data-field="role"><option value="viewer">Viewer</option><option value="editor">Editor</option><option value="admin">Admin</option></select></div>
    <div class="field" id="pw-f"><label>Temporary password</label><input type="text" id="pw" data-field="password" autocomplete="off"><div class="hint">They must change it at first login</div></div>
  </div>
  <div class="actions" style="margin-top:16px;justify-content:flex-end"><button type="button" id="cancel">Cancel</button><button class="primary" type="submit" id="save">Save</button></div>
</form></dialog>
<script src="/static/js/core.js"></script>
<script>
(async () => {
  const me = await App.init({ nav: "users", role: "admin" });
  if (!me) return;
  const $ = App.$;
  let editing = null;

  async function load() {
    const users = await App.api("GET", "/api/users");
    App.renderTable($("#t"), [
      { label: "Username", key: "username" },
      { label: "Full name", key: "full_name" },
      { label: "Role", key: "role" },
      { label: "Status", html: true, get: (u) => (u.active ? '<span class="badge held">active</span>' : '<span class="badge">disabled</span>') +
          (u.locked ? ' <span class="badge locked">locked</span>' : "") + (u.must_change_password ? ' <span class="badge warn">must change password</span>' : "") },
      { label: "Created", get: (u) => App.dateTime(u.created_at) },
      { label: "", html: true, get: (u) => '<span class="actions">' +
          '<button class="link" data-act="edit" data-u="' + App.esc(u.username) + '">edit</button>' +
          '<button class="link" data-act="reset" data-u="' + App.esc(u.username) + '">reset password</button>' +
          (u.locked ? '<button class="link" data-act="unlock" data-u="' + App.esc(u.username) + '">unlock</button>' : "") +
          (u.username !== me.username ? '<button class="link" data-act="toggle" data-u="' + App.esc(u.username) + '" data-active="' + u.active + '">' + (u.active ? "disable" : "enable") + "</button>" : "") +
          "</span>" },
    ], users);
    App.$$("#t [data-act]").forEach((b) => b.addEventListener("click", () => act(b.dataset.act, users.find((x) => x.username === b.dataset.u))));
  }

  async function act(what, u) {
    App.message("#msg", null);
    try {
      if (what === "edit") return openDialog(u);
      if (what === "reset") {
        const pw = window.prompt("New temporary password for " + u.username + " (they must change it at next login):");
        if (!pw) return;
        await App.api("POST", "/api/users/" + encodeURIComponent(u.username) + "/reset-password", { new_password: pw });
        App.message("#msg", "ok", "Password reset for " + u.username + ". They have been logged out.");
      }
      if (what === "unlock") { await App.api("PATCH", "/api/users/" + encodeURIComponent(u.username), { unlock: true }); App.message("#msg", "ok", u.username + " unlocked."); }
      if (what === "toggle") {
        await App.api("PATCH", "/api/users/" + encodeURIComponent(u.username), { active: !u.active });
        App.message("#msg", "ok", u.username + (u.active ? " disabled and logged out." : " enabled."));
      }
      load();
    } catch (e) { App.message("#msg", "bad", e.message); }
  }

  function openDialog(u) {
    editing = u || null;
    App.message("#fmsg", null);
    $("#dlg-title").textContent = u ? "Edit " + u.username : "New user";
    $("#u").value = u ? u.username : ""; $("#u").disabled = !!u;
    $("#fn").value = u ? u.full_name : ""; $("#role").value = u ? u.role : "viewer";
    $("#pw").value = ""; $("#pw-f").hidden = !!u;
    $("#dlg").showModal();
  }
  $("#new").addEventListener("click", () => openDialog(null));
  $("#cancel").addEventListener("click", () => $("#dlg").close());
  $("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    $("#save").disabled = true;
    try {
      if (editing) await App.api("PATCH", "/api/users/" + encodeURIComponent(editing.username), { full_name: $("#fn").value.trim(), role: $("#role").value });
      else await App.api("POST", "/api/users", { username: $("#u").value.trim(), full_name: $("#fn").value.trim(), role: $("#role").value, password: $("#pw").value });
      $("#dlg").close(); App.message("#msg", "ok", "Saved."); load();
    } catch (e) { App.showErrors("#fmsg", e, $("#dlg")); }
    finally { $("#save").disabled = false; }
  });
  load().catch((e) => App.message("#msg", "bad", e.message));
})();
</script>
</body>
</html>
