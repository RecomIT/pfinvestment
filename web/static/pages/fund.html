<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fund · Bond Amortization</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<main>
  <div class="crumbs"><a href="/">Companies</a> / <a id="c-co"></a><span id="c-co-sep"> / </span><span id="crumb"></span></div>
  <div class="page-head">
    <div><h1 id="title">Fund</h1><div class="muted" id="sub"></div></div>
    <div class="actions">
      <a class="btn" id="annex">Annexure-D</a>
      <button id="settings" hidden>Fund settings</button>
      <a class="btn primary" id="add" hidden>Add bond</a>
    </div>
  </div>
  <div id="msg" hidden></div>
  <div class="cards" id="cards"></div>
  <div class="panel flush">
    <div class="panel-head"><h2>Bonds</h2><span class="muted small">Carrying value as at today</span></div>
    <div class="table-wrap"><table id="t"></table></div>
  </div>
</main>
<script src="/static/js/core.js"></script>
<script src="/static/js/fund_form.js"></script>
<script>
(async () => {
  const me = await App.init({ nav: "funds" });
  if (!me) return;
  const code = App.qs("code");
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  let fund;
  try {
    fund = await App.api("GET", "/api/funds/" + encodeURIComponent(code));
  } catch (e) { App.message("#msg", "bad", e.message); return; }
  document.title = fund.code + " · Bond Amortization";
  App.$("#crumb").textContent = fund.code;
  if (fund.company) { App.$("#c-co").textContent = fund.company; App.$("#c-co").href = App.url("/company", { code: fund.company }); }
  else { App.$("#c-co").hidden = true; App.$("#c-co-sep").hidden = true; }
  App.$("#title").textContent = fund.name;
  App.$("#sub").textContent = (fund.company_name ? fund.company_name + " · " : "No company assigned · ") + fund.code + " · year ends " + fund.year_end_day + " " + months[fund.year_end_month - 1] +
    " · TDS " + App.pct(fund.tds_rate, 2) + (fund.archived ? " · archived" : "");
  App.$("#annex").href = App.url("/annexure", { code: fund.code });
  if (App.can("editor")) { App.$("#add").hidden = false; App.$("#add").href = App.url("/bond/edit", { fund: fund.code }); }
  if (App.can("admin")) {
    App.$("#settings").hidden = false;
    App.$("#settings").onclick = () => App.fundDialog(fund, () => location.reload());
  }
  try {
    const bonds = await App.api("GET", "/api/funds/" + encodeURIComponent(code) + "/bonds");
    const held = bonds.filter((b) => b.status === "held");
    App.$("#cards").innerHTML = [
      ["Bonds held", String(held.length)],
      ["Face value held", App.money(App.sum(held, "face_value"))],
      ["Carrying value today", App.money(App.sum(held, "carrying_value_today"))],
      ["Sold / matured", String(bonds.filter((b) => b.status === "sold" || b.status === "matured").length)],
    ].map(([k, v]) => '<div class="card"><div class="k">' + k + '</div><div class="v">' + v + "</div></div>").join("");
    App.renderTable(App.$("#t"), [
      { label: "ISIN", html: true, cls: "sticky", get: (b) => '<a href="' + App.url("/bond", { fund: code, isin: b.isin }) + '">' + App.esc(b.isin) + "</a>" },
      { label: "Name", key: "name" },
      { label: "Face value", key: "face_value", type: "money" },
      { label: "Coupon", key: "coupon_rate", type: "pct", dp: 2 },
      { label: "IRR", key: "irr", type: "pct" },
      { label: "Purchased", key: "purchase_date", type: "date" },
      { label: "Matures", key: "maturity_date", type: "date" },
      { label: "Day basis", get: (b) => b.day_basis === "excel_182" ? "Excel (182)" : "Actual days" },
      { label: "Carrying value", key: "carrying_value_today", type: "money" },
      { label: "Status", html: true, get: (b) => '<span class="badge ' + b.status + '">' + b.status + "</span>" +
          (b.warnings && b.warnings.length ? ' <span class="badge warn" title="' + App.esc(b.warnings.join("\n")) + '">' + b.warnings.length + " note" + (b.warnings.length > 1 ? "s" : "") + "</span>" : "") },
      { label: "Last change", get: (b) => (b.updated_by || "") + " " + App.dateTime(b.updated_at) },
    ], bonds, bonds.length ? { _label: "Total held", face_value: App.sum(held, "face_value"), carrying_value_today: App.sum(held, "carrying_value_today") } : null);
  } catch (e) { App.message("#msg", "bad", e.message); }
})();
</script>
</body>
</html>
