<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My account · Bond Amortization</title>
<link rel="stylesheet" href="/static/css/app.css">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
</head>
<body>
<main class="narrow">
  <div class="page-head"><div><h1>My account</h1><div class="muted" id="who"></div></div></div>
  <div id="must" class="msg warn" hidden>Please choose a new password before continuing.</div>
  <form class="panel" id="f">
    <h2>Change password</h2>
    <div id="msg" hidden></div>
    <div class="form-grid">
      <div class="field"><label for="cur">Current password</label><input type="password" id="cur" autocomplete="current-password" required></div>
      <div class="field"><label for="n1">New password</label><input type="password" id="n1" autocomplete="new-password" required>
        <div class="hint">At least 8 characters, letters and digits</div></div>
      <div class="field"><label for="n2">Repeat new password</label><input type="password" id="n2" autocomplete="new-password" required></div>
    </div>
    <div class="actions" style="margin-top:12px"><button class="primary" type="submit" id="save">Change password</button></div>
  </form>
</main>
<script src="/static/js/core.js"></script>
<script>
(async () => {
  const me = await App.init({ nav: "account" });
  if (!me) return;
  App.$("#who").textContent = me.username + " · " + me.role;
  App.$("#must").hidden = !me.must_change_password;
  App.$("#f").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    if (App.$("#n1").value !== App.$("#n2").value) { App.message("#msg", "bad", "The two new passwords do not match."); return; }
    App.$("#save").disabled = true;
    try {
      await App.api("POST", "/api/auth/change-password", { current_password: App.$("#cur").value, new_password: App.$("#n1").value });
      App.$("#f").reset();
      if (me.must_change_password) { location.href = "/"; return; }
      App.message("#msg", "ok", "Password changed.");
    } catch (e) { App.message("#msg", "bad", e.message); }
    finally { App.$("#save").disabled = false; }
  });
})();
</script>
</body>
</html>
